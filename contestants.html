    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Prompt:wght@300;600&display=swap" rel="stylesheet">
    <style>
        body { background: #12161d; margin: 0; font-family: 'Montserrat', 'Prompt', sans-serif; color: white; }
        .nav-menu { text-align: center; padding: 20px; background: #1a1f29; }
        .nav-menu a { color: #d4af37; text-decoration: none; margin: 0 15px; font-weight: 700; letter-spacing: 1px; font-family: 'Montserrat', sans-serif; }
        
        .container { max-width: 1100px; margin: auto; padding: 30px 20px; }
        
        h1 { color: #d4af37; text-align: center; letter-spacing: 2px; font-weight: 700; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #b0bec5; font-size: 13px; margin-bottom: 40px; }

        /* ส่วนแสดงรูปภาพผู้เข้าประกวด */
        .contestants-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding-bottom: 50px;
        }
        .contestant-card {
            background: #1a1f29;
            border: 1px solid #333;
            border-radius: 12px;
            overflow: hidden;
            text-align: center;
            padding: 15px;
            transition: 0.3s;
            position: relative;
        }
        .contestant-card:hover {
            border-color: #d4af37;
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.2);
        }
        .contestant-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
            background: #12161d;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .contestant-img:hover {
            opacity: 0.85;
        }
        .contestant-country {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .contestant-name {
            font-size: 11px;
            font-weight: 400;
            color: #d4af37;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }
        
        /* ปุ่มกดโหวตใต้รูป */
        .vote-card-btn {
            background: rgba(212, 175, 55, 0.1);
            color: #d4af37;
            border: 1px solid #d4af37;
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            font-family: 'Montserrat';
        }
        .vote-card-btn:hover {
            background: #d4af37;
            color: #12161d;
        }
        .vote-card-btn:disabled {
            border-color: #555;
            color: #777;
            background: transparent;
            cursor: not-allowed;
        }
    </style>
</head>

        // ฟังก์ชันสั่งบันทึกคะแนนโหวตลง Firebase พร้อมแจ้งเตือน
        function voteForCountry(countryName) {
            db.ref('26Votes/' + countryName.replace(/ /g, "_")).transaction(c => (c || 0) + 1).then(() => {
                alert(`VOTE SUCCESS! +1 vote for ${countryName.toUpperCase()}!`);
            });
        }

        // แสดงผลแกลเลอรี
        const grid = document.getElementById('contestants-grid');
        Object.keys(countryKeys).sort().forEach(country => {
            const card = document.createElement('div');
            card.className = 'contestant-card';
            
            let imgPath = "";
            let nameHtml = "";
            let isRegistered = registeredContestants[country] !== undefined;

            if (isRegistered) {
                const data = registeredContestants[country];
                imgPath = `Picture/PIC ${data.file}.png`;
                nameHtml = `<div class="contestant-name">${data.name}</div>`;
            } else {
                imgPath = `Picture/PIC blank.png`;
                nameHtml = `<div class="contestant-name" style="color:#777;">(Not yet registered)</div>`;
            }

            card.innerHTML = `
                <img src="${imgPath}" class="contestant-img" alt="${country}" title="Click to Vote for ${country}" onerror="this.src='https://via.placeholder.com/180x220?text=No+Image'">
                <div class="contestant-country">${country.toUpperCase()}</div>
                ${nameHtml}
                <button class="vote-card-btn" ${!isRegistered ? 'disabled' : ''} onclick="voteForCountry('${country}')">
                    ${isRegistered ? 'VOTE' : 'UNAVAILABLE'}
                </button>
            `;

                const imgElement = card.querySelector('.contestant-img');
                imgElement.onclick = () => voteForCountry(country);
            }

            grid.appendChild(card);
        });
